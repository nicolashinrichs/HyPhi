name: Release

# Build the package and publish it to TestPyPI when a version tag is pushed. Move to the real
# PyPI index (and trusted publishing) once a TestPyPI release has been verified end to end.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

# Least privilege: the job only builds and publishes via an explicit token, never the GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish to TestPyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build the sdist and wheel
        run: uv build

      - name: Check the built artifacts
        run: uv run --with twine twine check dist/*

      - name: Publish to TestPyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.TEST_PYPI_TOKEN }}
        run: uv publish --publish-url https://test.pypi.org/legacy/
