name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Cover the supported range (requires-python >= 3.11). 3.14 is excluded:
        # this lock's jaxlib has no cp314 wheel, so uv sync would fail there.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # --frozen: fail if uv.lock is out of sync with pyproject (e.g. a PR
        # edits dependencies without regenerating the lock) instead of silently
        # re-resolving.
        run: uv sync --extra develop --frozen

      # Every `uv run` keeps --extra develop: a bare `uv run` re-syncs the
      # environment to the default dependency set, REMOVING the dev extras
      # installed above (pytest, ruff) and failing the step.
      - name: Import every module
        run: |
          uv run --extra develop python - <<'EOF'
          import importlib
          import pkgutil

          import hyphi

          failures = []
          for mod in pkgutil.walk_packages(hyphi.__path__, prefix="hyphi."):
              try:
                  importlib.import_module(mod.name)
              except Exception as exc:  # noqa: BLE001
                  failures.append(f"{mod.name}: {exc}")
          if failures:
              raise SystemExit("unimportable modules:\n" + "\n".join(failures))
          print("all hyphi modules import")
          EOF

      - name: Run tests
        run: uv run --extra develop pytest -q

      - name: Lint
        # Gating: code/hyphi is ruff-clean, so any new violation fails CI.
        run: uv run --extra develop ruff check code/hyphi

      - name: Type check
        # Non-gating: the only remaining ty diagnostics are the optional-import
        # (plotly/seaborn) None-union pattern that static analysis cannot follow.
        # Surfaces type regressions on PRs (same as `make typecheck`).
        continue-on-error: true
        run: uv run --extra develop ty check code/hyphi
